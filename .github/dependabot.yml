# Grouped, monthly, and deliberately conservative.
#
# This repository pins `maplibre-gl` exactly (see package.json): `react-map-gl@8` reaches into MapLibre's
# internal transform, which changed shape in `maplibre-gl@6`. It installs, type-checks and renders tiles,
# and then the camera silently stops working. So MapLibre is excluded from automatic updates entirely —
# a bump there needs a human to run `npm run verify:browser` and watch the map.
#
# Everything else is grouped into two PRs a month rather than a stream of single-package ones, because a
# grouped PR gets its full verification run and a stream does not.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      production:
        dependency-type: production
        patterns: ["*"]
        exclude-patterns: ["maplibre-gl", "react-map-gl"]
      development:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # Pinned deliberately; see the note above and BUILD_PLAN M2.
      - dependency-name: maplibre-gl
      - dependency-name: react-map-gl

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
